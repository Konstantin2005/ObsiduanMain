name: AI Orchestrator — Full Pipeline

on:
  issues:
    types: [opened, labeled]
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      issue:
        description: 'Issue number to process'
        required: true
      mode:
        description: 'Execution mode'
        default: 'full'
        type: choice
        options:
          - full
          - architect-only

permissions:
  contents: write
  issues: write
  pull-requests: write

env:
  AI_SYSTEM_DIR: ai-dev-orchestration-system
  WORK_DIR: .work/issues

jobs:
  orchestrate:
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issues' && github.event.action == 'opened') ||
      (github.event_name == 'issue_comment' &&
        startsWith(github.event.comment.body, '/ai'))
    steps:
      - name: Checkout with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ${{ env.AI_SYSTEM_DIR }}/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: ${{ env.AI_SYSTEM_DIR }}

      - name: Parse issue input
        id: parse
        env:
          TITLE: ${{ github.event.issue.title || 'Manual run' }}
          BODY: ${{ github.event.issue.body || '' }}
        run: |
          ISSUE_NUM="${{ github.event.issue.number || inputs.issue }}"
          SANITIZED=$(echo "$TITLE" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9а-я ]/-/g' | sed 's/--*/-/g' | sed 's/^-//;s/-$//')
          SLUG=$(echo "$SANITIZED" | sed 's/[^a-z0-9-]//g' | head -c 80)
          [ -z "$SLUG" ] && SLUG="issue-${ISSUE_NUM}"
          echo "issue=$ISSUE_NUM" >> "$GITHUB_OUTPUT"
          echo "slug=$SLUG" >> "$GITHUB_OUTPUT"
          echo "title=$TITLE" >> "$GITHUB_OUTPUT"

      - name: Run AI Orchestrator pipeline
        id: pipeline
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ISSUE="${{ steps.parse.outputs.issue }}"
          PROJECT_ROOT="${{ github.workspace }}"

          node "${{ env.AI_SYSTEM_DIR }}/bin/ai-orchestrator" run \
            --owner "${{ github.repository_owner }}" \
            --repo "${{ github.event.repository.name }}" \
            --issue "$ISSUE"

          echo "Pipeline completed for issue #$ISSUE"

      - name: Sync work data to orchestrator
        if: always()
        run: |
          ISSUE_NUM="${{ github.event.issue.number || steps.parse.outputs.issue }}"
          TIMESTAMP=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          SUMMARY="{\"timestamp\":\"$TIMESTAMP\",\"issue\":\"$ISSUE_NUM\",\"event\":\"${{ github.event_name }}.${{ github.event.action }}\",\"dirs\":["

          WORK_DIR="${{ env.WORK_DIR }}"
          FIRST=true
          for dir in "$WORK_DIR"/*/; do
            [ -d "$dir" ] || continue
            NAME=$(basename "$dir")
            FILE_COUNT=$(find "$dir" -type f 2>/dev/null | wc -l)
            ERRORS=$(grep -ri "error\|fail\|crash\|exception\|fatal" "$dir" --include="*.log" -l 2>/dev/null | wc -l)
            [ "$FIRST" = "true" ] && FIRST=false || SUMMARY+=","
            SUMMARY+="{\"name\":\"$NAME\",\"files\":$FILE_COUNT,\"errors\":$ERRORS}"
          done
          SUMMARY+="]}"

          echo "$SUMMARY" > /tmp/sync-summary.json
          echo "SYNC_SUMMARY=$SUMMARY" >> "$GITHUB_ENV"

          # Try to dispatch to orchestrator repo
          if [ -n "${{ secrets.ORCHESTRATOR_PAT }}" ]; then
            gh api -X POST /repos/Konstantin2005/ai-dev-orchestration-system/dispatches \
              -f event_type="sync-from-obsidian" \
              -f "client_payload=$(cat /tmp/sync-summary.json)" 2>/dev/null \
              && echo "Synced to orchestrator" || echo "Sync dispatch failed (no PAT?)"
          fi

      - name: Post result comment
        if: always() && github.event.issue.number
        uses: actions/github-script@v7
        with:
          script: |
            const issueNum = '${{ steps.parse.outputs.issue }}';
            const slug = '${{ steps.parse.outputs.slug }}';
            const dir = `${{ env.WORK_DIR }}/${issueNum}-${slug}`;

            const fs = require('fs');
            const path = require('path');
            const logPath = path.join(process.env.GITHUB_WORKSPACE, dir, 'logs', 'orchestrator.log');
            let summary = '';

            try {
              const log = fs.readFileSync(logPath, 'utf-8');
              const lines = log.trim().split('\n');
              summary = '```\n' + lines.slice(-10).join('\n') + '\n```';
            } catch {
              summary = 'Log file not found';
            }

            const contextDir = path.join(process.env.GITHUB_WORKSPACE, dir, 'shared', 'context.md');
            let status = '❌ FAILED';
            try {
              const ctx = fs.readFileSync(contextDir, 'utf-8');
              if (ctx.includes('state: DONE') || ctx.includes('state: DONE')) status = '✅ DONE';
            } catch {}

            const body = `## 🤖 AI Orchestrator Result

**Issue:** #${issueNum}
**Status:** ${status}
**Workspace:** \`${dir}/\`

### Pipeline Log (last 10 lines)
${summary}
`;
            github.rest.issues.createComment({
              issue_number: parseInt(issueNum),
              owner: context.repo.owner,
              repo: context.repo.repo,
              body
            });
